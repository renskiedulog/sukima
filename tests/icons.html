<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sukima icon renderer</title>
  </head>
  <body style="background:#ddd">
    <!-- Dev tool: renders lucide "languages" on the accent tile at 16/48/128. window.sukimaIcons holds PNG data URLs. -->
    <script src="/shared/icons.js"></script>
    <script>
      const ACCENT = '#2d4f9e';
      const paths = [...SukimaIcons.PATHS.languages.matchAll(/d="([^"]+)"/g)].map((m) => new Path2D(m[1]));
      window.sukimaIcons = {};
      for (const size of [16, 48, 128]) {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const ctx = c.getContext('2d');
        const r = size * 0.22;
        ctx.fillStyle = ACCENT;
        ctx.beginPath();
        ctx.roundRect(0, 0, size, size, r);
        ctx.fill();
        const pad = size * (size <= 16 ? 0.1 : 0.18);
        const scale = (size - pad * 2) / 24;
        ctx.translate(pad, pad);
        ctx.scale(scale, scale);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = size <= 16 ? 2.6 : 2.1;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for (const p of paths) ctx.stroke(p);
        window.sukimaIcons[size] = c.toDataURL('image/png');
        const img = new Image();
        img.src = window.sukimaIcons[size];
        img.style.margin = '8px';
        document.body.append(img);
      }
    </script>
  </body>
</html>
